<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Подготовка фрагментов — Мистические пазлы</title>
    <style>
      * { box-sizing: border-box; } body { margin: 0; padding: 28px; color: #f5e7cd; background: #091728; font: 16px Georgia, serif; }
      main { max-width: 800px; margin: auto; padding: 24px; border: 1px solid #b48549; border-radius: 20px; background: #11263b; }
      h1 { color: #ffd27b; margin: 0 0 8px; } p { line-height: 1.5; color: #ded3c0; }
      label { display: inline-flex; flex-direction: column; gap: 6px; margin: 8px 12px 8px 0; }
      input, button { padding: 11px 14px; border: 1px solid #d7ac65; border-radius: 10px; color: #fff3da; background: #1c3145; font: inherit; }
      button { cursor: pointer; background: #32683e; } button:disabled { opacity: .5; cursor: wait; }
      #status { white-space: pre-wrap; margin: 18px 0; } #downloads { display: flex; gap: 12px; flex-wrap: wrap; }
      a { color: #ffdc98; } #preview { max-width: 100%; max-height: 460px; border: 1px solid #426079; border-radius: 10px; }
    </style>
  </head>
  <body><main>
    <h1>Подготовка фигурных фрагментов</h1>
    <p>Для первого уровня используйте шаблон 2 × 4: восемь плавных фигурных деталей. Генератор создаст PNG атлас и JSON с координатами и проверками качества. Другие размеры сетки остаются экспериментальными.</p>
    <label>Иллюстрация<input id="source" type="file" accept="image/png,image/jpeg,image/webp" /></label>
    <label>Столбцы<input id="cols" type="number" min="1" max="6" value="2" /></label>
    <label>Строки<input id="rows" type="number" min="1" max="8" value="4" /></label>
    <label>Seed<input id="seed" type="number" value="713" /></label>
    <p><button id="generate" disabled>Создать PNG и JSON</button></p>
    <div id="status">Сначала выберите файл иллюстрации.</div>
    <img id="preview" hidden alt="Предпросмотр сгенерированного атласа" />
    <div id="downloads"></div>
  </main><script type="module" src="./generator.ts"></script></body>
</html>
